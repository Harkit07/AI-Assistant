name: AI Assistant CI/CD

on:
  # Run manually from Actions, or automatically after a push to main.
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          # Add these as repository Actions secrets before running the workflow.
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-assistant-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-assistant-frontend:latest

  deploy:
    needs: docker
    # The self-hosted runner must have access to the target Kubernetes cluster.
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select minikube cluster
        run: |
          # Confirm the runner can access the intended cluster before deploying.
          kubectl config use-context minikube
          kubectl get nodes

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/backend-deployment.yaml \
                        -f k8s/frontend-deployment.yaml \
                        -f k8s/ingress.yaml

      - name: Restart deployments to pull latest images
        run: |
          kubectl rollout restart deployment/backend deployment/frontend

      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/backend --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s
