name: AI Assistant CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-assistant-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          build-args: |
            VITE_BASE_URL=http://ai-assistant.local
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-assistant-frontend:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: ${{ runner.temp }}/kubeconfig
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::Add the KUBE_CONFIG secret in the repository Actions settings."
            exit 1
          fi
          umask 077
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/backend-deployment.yaml \
                        -f k8s/frontend-deployment.yaml \
                        -f k8s/ingress.yaml

      - name: Restart deployments to pull latest images
        run: |
          kubectl rollout restart deployment/backend deployment/frontend

      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/backend --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s