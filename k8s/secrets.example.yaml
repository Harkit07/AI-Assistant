apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  mongodb-uri: "mongodb+srv://<user>:<password>@<cluster>/ai-assistant"
  openai-api-key: "<your-nvidia-api-key>"
  jwt-secret: "<long-random-string>"
  node-env: "production"
  client-url: "http://ai-assistant.local"
  mongo-url: "<unused-by-code-see-note>"
  VITE_BASE_URL: "http://ai-assistant.local"